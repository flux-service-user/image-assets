<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <!-- Upper cloud body: deep blue to sky blue -->
    <linearGradient id="gTop" gradientUnits="userSpaceOnUse" x1="40" y1="44" x2="168" y2="130">
      <stop offset="0" stop-color="#2954F5"/>
      <stop offset="1" stop-color="#1F9CF2"/>
    </linearGradient>
    <!-- Base layer: sky blue to cyan -->
    <linearGradient id="gBase" gradientUnits="userSpaceOnUse" x1="24" y1="137" x2="176" y2="162">
      <stop offset="0" stop-color="#1F9CF2"/>
      <stop offset="1" stop-color="#12C6D6"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A74FF"/>
      <stop offset="1" stop-color="#1FA8E0"/>
    </linearGradient>
   
  </defs>

  <!-- Mark: layered cloud, transparent gap between body and base -->
  <g transform="translate(40,70) scale(1.3)">
    <g mask="url(#cloud)">
      <rect x="0" y="0" width="200" height="130" fill="url(#gTop)"/>
      <rect x="0" y="137" width="200" height="63" fill="url(#gBase)"/>
    </g>
  </g>

  <text x="360" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="150" font-weight="600" letter-spacing="-3" fill="url(#gt)">Kosina<tspan font-weight="300" fill="#8793AB" dx="16">Cloud</tspan></text>
</svg>
